name: windows-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: Unit + Integration (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules (better-sqlite3)
        run: npm run rebuild

      - name: Run unit + integration tests
        run: npm test

  smoke:
    name: Smoke (Windows GUI boot)
    runs-on: windows-latest
    timeout-minutes: 15
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules (better-sqlite3)
        run: npm run rebuild

      - name: Run smoke probe (headless boot + renderer DOM check)
        run: npm run smoke

  e2e:
    name: GUI E2E (Playwright + Electron)
    runs-on: windows-latest
    timeout-minutes: 30
    needs: smoke
    # Spec §90: E2E 是发布门禁，必须真实失败，不再用 continue-on-error 静默放行。
    # 已知问题：GitHub-hosted Windows runner 偶发丢失交互式桌面会话，
    # 导致 Playwright 无法驱动真实 Electron 窗口。若再次复现，应开 issue
    # 记录根因并修复，而非掩盖失败。参考 spec §67-68 的真实性要求。
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules (better-sqlite3)
        run: npm run rebuild

      - name: Run GUI E2E (Playwright + real Electron window)
        run: npm run e2e

  record-conclusion:
    name: Record CI conclusion (truthfulness)
    # CI 真实性（spec §105）：记录 workflow 与每个 job 的 conclusion。
    # 若无此 CI 记录可访问，对应结果应视为 "NOT INDEPENDENTLY VERIFIED"。
    runs-on: ubuntu-latest
    if: always()
    needs: [unit, smoke, e2e]
    steps:
      - name: Record workflow/job/conclusion
        shell: bash
        run: |
          echo "workflow=${{ github.workflow }}"
          echo "run_id=${{ github.run_id }}"
          echo "run_attempt=${{ github.run_attempt }}"
          echo "unit=${{ needs.unit.result }}"
          echo "smoke=${{ needs.smoke.result }}"
          echo "e2e=${{ needs.e2e.result }}"
