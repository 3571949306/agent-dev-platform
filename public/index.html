<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Dev Platform</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        <span>Agent Dev Platform</span>
      </div>
      <div class="project-switch">
        <button id="btn-project" class="pill">未打开项目</button>
      </div>
      <div class="topbar-status"><span class="dot" id="status-dot"></span><span id="status-text">Ready</span></div>
      <nav class="topnav">
        <button data-page="dashboard">总览</button>
        <button data-page="connections">API</button>
        <button data-page="agents">Agents</button>
        <button data-page="mcp">MCP</button>
        <button data-page="diagnostics">诊断</button>
        <button data-page="settings">设置</button>
      </nav>
    </header>

    <div id="body">
      <aside id="left">
        <div class="left-tabs">
          <button class="ltab active" data-ltab="chats">Chats</button>
          <button class="ltab" data-ltab="files">Files</button>
        </div>
        <div id="left-chats" class="left-pane"></div>
        <div id="left-files" class="left-pane hidden"></div>
      </aside>

      <main id="center">
        <div id="chat-header">
          <select id="agent-select"></select>
          <select id="model-select"></select>
          <button id="btn-newchat" class="btn">+ 新对话</button>
        </div>
        <div id="messages"></div>
        <div id="composer">
          <textarea id="input" placeholder="输入自然语言需求，例如：分析这个项目为什么构建失败并修复…（Enter 发送，Shift+Enter 换行）"></textarea>
          <div class="composer-actions">
            <span class="hint" id="composer-hint"></span>
            <button id="btn-stop" class="btn danger hidden">■ Stop</button>
            <button id="btn-send" class="btn primary">发送 ▸</button>
          </div>
        </div>
      </main>

      <aside id="right">
        <div class="right-section">
          <div class="section-title">AGENTS</div>
          <div id="agents-list"></div>
        </div>
        <div class="right-section">
          <div class="section-title">TASKS</div>
          <div id="tasks-list"></div>
        </div>
      </aside>
    </div>

    <footer id="bottom">
      <div class="bottom-tabs">
        <button class="btab active" data-btab="terminal">Terminal</button>
        <button class="btab" data-btab="diff">Diff</button>
        <button class="btab" data-btab="problems">Problems</button>
        <button class="btab" data-btab="tasks">Tasks</button>
        <button class="btab" data-btab="computer">Computer</button>
        <button class="btab" data-btab="logs">Logs</button>
        <button class="btab" data-btab="usage">Usage</button>
      </div>
      <div id="bottom-terminal" class="bottom-pane"></div>
      <div id="bottom-diff" class="bottom-pane hidden"></div>
      <div id="bottom-problems" class="bottom-pane hidden"></div>
      <div id="bottom-tasks" class="bottom-pane hidden"></div>
      <div id="bottom-computer" class="bottom-pane hidden"></div>
      <div id="bottom-logs" class="bottom-pane hidden"></div>
      <div id="bottom-usage" class="bottom-pane hidden"></div>
    </footer>
  </div>

  <div id="modal-overlay" class="hidden"><div id="modal"></div></div>
  <div id="toast"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
