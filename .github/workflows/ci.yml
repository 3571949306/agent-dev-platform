name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: 单元测试 (Electron Node)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron ABI
        # better-sqlite3 必须按 Electron 的 Node ABI 重新编译，否则主进程加载即崩
        run: npm run rebuild

      - name: Run test suite
        # 测试以 ELECTRON_RUN_AS_NODE=1 运行（见 scripts/run-tests.js），
        # 自动匹配 better-sqlite3 的 Electron ABI。
        run: npm test

  smoke:
    name: 冒烟测试 (Electron GUI)
    runs-on: windows-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron ABI
        run: npm run rebuild

      - name: Smoke test
        # 启动 Electron，断言渲染层挂载 + 无控制台 fatal 错误后退出。
        # 需要显示环境；GitHub Windows runner 自带虚拟显示。
        run: npm run smoke

  e2e:
    name: E2E (Electron + Cline sidecar)
    runs-on: windows-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache pinned Cline Node runtime
        uses: actions/cache@v4
        with:
          path: .cache/cline-runtime
          key: cline-runtime-${{ runner.os }}-${{ hashFiles('sidecars/cline-runtime/runtime-manifest.json', 'sidecars/cline-runtime/package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron ABI
        run: npm run rebuild

      - name: Run E2E suite
        run: npm run e2e

  integration:
    name: Integration Smoke (Node 22 + ClineCore)
    runs-on: windows-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache pinned Cline Node runtime
        uses: actions/cache@v4
        with:
          path: .cache/cline-runtime
          key: cline-runtime-${{ runner.os }}-${{ hashFiles('sidecars/cline-runtime/runtime-manifest.json', 'sidecars/cline-runtime/package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Run real ClineCore fixture without a paid provider
        run: npm run integration-smoke

  dist:
    name: Packaging build (electron-builder)
    runs-on: windows-latest
    needs: [smoke, e2e, integration]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache pinned Cline Node runtime
        uses: actions/cache@v4
        with:
          path: .cache/cline-runtime
          key: cline-runtime-${{ runner.os }}-${{ hashFiles('sidecars/cline-runtime/runtime-manifest.json', 'sidecars/cline-runtime/package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron ABI
        run: npm run rebuild

      - name: Build distributable (NSIS + portable)
        # 验证打包链路不回归（predist 会先 prepare-cline-runtime）。
        # 不发布产物（--publish never），仅作为 CI gate；产物不作为下游 smoke 输入。
        run: npm run dist

  record-conclusion:
    name: Record CI conclusion (truthfulness)
    # CI 真实性（spec §105）：记录 workflow 与每个 job 的 conclusion。
    # 若无此 CI 记录可访问，对应结果应视为 "NOT INDEPENDENTLY VERIFIED"。
    runs-on: ubuntu-latest
    if: always()
    needs: [test, smoke, e2e, integration, dist]
    steps:
      - name: Record workflow/job/conclusion
        shell: bash
        run: |
          echo "workflow=${{ github.workflow }}"
          echo "run_id=${{ github.run_id }}"
          echo "run_attempt=${{ github.run_attempt }}"
          echo "test=${{ needs.test.result }}"
          echo "smoke=${{ needs.smoke.result }}"
          echo "e2e=${{ needs.e2e.result }}"
          echo "integration=${{ needs.integration.result }}"
          echo "dist=${{ needs.dist.result }}"
